<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Hub</title>
<style>
:root{--bg:#F5F4EE;--card:#FFF;--fg:#1F1E1D;--mut:#7A776E;--line:#E4E1D6;--acc:#C96442;--user:#EAE7DB;--sheet:#FAF9F5}
@media(prefers-color-scheme:dark){:root{--bg:#262624;--card:#30302E;--fg:#F3F1EA;--mut:#A29F94;--line:#43423E;--user:#3A3935;--sheet:#2D2C2A}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;display:flex;flex-direction:column;max-width:760px;margin:auto;padding-top:env(safe-area-inset-top)}
button,select,input,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:8px;padding:10px 14px}
header h1{font:500 22px ui-serif,Georgia,serif;margin:0;flex:1}
.ib{background:none;border:0;padding:0;width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:50%;cursor:pointer;color:var(--fg);font-size:18px}
.ib:hover{background:var(--user)}
.tabs{display:flex;background:var(--user);border-radius:12px;padding:3px;margin:0 14px 6px}
.tabs button{flex:1;border:0;background:none;padding:7px;border-radius:9px;cursor:pointer;color:var(--mut)}
.tabs .on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px #0002}
main{flex:1;overflow:auto;padding:8px 16px 16px}
.empty{margin-top:18vh;text-align:center;font:400 28px ui-serif,Georgia,serif;color:var(--fg)}
.empty small{display:block;font:14px system-ui;color:var(--mut);margin-top:8px}
.u{background:var(--user);padding:10px 14px;border-radius:18px;margin:14px 0 14px 18%;white-space:pre-wrap;word-break:break-word}
.a{margin:14px 0;font-family:ui-serif,Georgia,serif;font-size:17px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px 9px;font-size:13px;color:var(--mut)}
.chip img{height:28px;border-radius:5px;vertical-align:middle;margin-right:4px}
.code{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;margin:8px 0;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.code pre{margin:0;padding:12px;overflow:auto;white-space:pre}
.code button{position:absolute;top:6px;right:6px;border:1px solid var(--line);background:var(--bg);border-radius:8px;font-size:12px;padding:2px 8px;cursor:pointer}
code{background:var(--user);padding:1px 5px;border-radius:5px;font-size:.9em}
.step{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:10px 0}
.step h3{margin:0 0 2px;font:500 16px system-ui}.step p{margin:2px 0 8px;color:var(--mut);font-size:14px}
.step select{max-width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 8px;font-size:13px}
.st{font-size:13px;color:var(--acc);margin-top:6px}
.out{font-family:system-ui;font-size:15px;line-height:1.55;white-space:pre-wrap;margin-top:8px}
footer{padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
.comp{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:10px 10px 8px 14px;box-shadow:0 2px 10px #0000000d}
.comp textarea{width:100%;border:0;outline:0;resize:none;background:none;max-height:160px;padding:2px 0}
.row{display:flex;align-items:center;gap:6px;margin-top:4px}
.row select{border:0;background:none;color:var(--mut);max-width:55%;font-size:14px}
.send{width:36px;height:36px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:18px;cursor:pointer}
.send:disabled{opacity:.4}
.sheet{position:fixed;inset:0;background:#0006;display:none;z-index:9}.sheet.open{display:block}
.pane{position:absolute;left:0;right:0;bottom:0;max-width:760px;margin:auto;max-height:90%;overflow:auto;background:var(--sheet);border-radius:22px 22px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.pane h2{font:500 20px ui-serif,Georgia,serif;margin:4px 0 10px}.pane h4{margin:18px 0 6px;font-size:14px;color:var(--mut);font-weight:600}
.pane input,.pane textarea,.pane select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:3px 0}
.prov{border:1px solid var(--line);border-radius:14px;padding:10px;margin:8px 0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;cursor:pointer}
.btn.p{background:var(--acc);color:#fff;border:0}
.pool{display:flex;gap:8px;align-items:center;margin:4px 0}.pool input[type=checkbox]{width:auto}.pool span{font-size:13px;flex:0 0 38%;overflow:hidden;text-overflow:ellipsis}
.hint{font-size:13px;color:var(--mut)}
[hidden]{display:none!important}.pool.mrow{padding:2px 0}.pool.mrow span{overflow:hidden;text-overflow:ellipsis}
</style></head><body>
<header><h1>AI Hub</h1><button class="ib" id="newb" title="New chat">✎</button><button class="ib" id="setb" title="Settings">⚙</button></header>
<div class="tabs"><button id="t-chat" class="on">Chat</button><button id="t-agent">Code agent</button></div>
<main id="main"></main>
<footer>
<div class="chips" id="att" style="margin:0 6px 6px"></div>
<div class="comp"><textarea id="inp" rows="1" placeholder="Message"></textarea>
<div class="row"><button class="ib" id="attb" title="Attach photos or files">＋</button><input type="file" id="file" multiple hidden>
<select id="msel"></select><span style="flex:1"></span><button class="send" id="send">↑</button></div></div></footer>

<div class="sheet" id="sheet"><div class="pane" id="pane"></div></div>

<script>
const $=s=>document.querySelector(s);
const PRESETS={"OpenAI":["openai","https://api.openai.com/v1","gpt-4o,gpt-4o-mini"],"Anthropic":["anthropic","https://api.anthropic.com","claude-sonnet-4-5,claude-haiku-4-5"],"OpenRouter":["openai","https://openrouter.ai/api/v1","anthropic/claude-sonnet-4.5,google/gemini-2.5-pro,deepseek/deepseek-chat"],"Google Gemini":["openai","https://generativelanguage.googleapis.com/v1beta/openai","gemini-2.5-pro,gemini-2.5-flash"],"Groq":["openai","https://api.groq.com/openai/v1","llama-3.3-70b-versatile"],"DeepSeek":["openai","https://api.deepseek.com/v1","deepseek-chat,deepseek-reasoner"],"Custom":["openai","https://","model-name"]};
let S=JSON.parse(localStorage.getItem('aihub')||'null')||{providers:[],router:'',pool:{},cm:'',adapt:true,chat:[]};
S.chatOn=S.chatOn||{};S.providers.forEach(p=>{if(!p.avail){p.avail=(p.models||'').split(',').map(x=>x.trim()).filter(Boolean);delete p.models}});
let tab='chat',atts=[],busy=false;
const save=()=>{try{localStorage.setItem('aihub',JSON.stringify(S))}catch(e){}};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const refs=()=>S.providers.flatMap(p=>(p.avail||[]).map(m=>p.id+'|'+m));
const label=r=>{const[i,...m]=r.split('|');const p=S.providers.find(x=>x.id==i);return(p?p.name:i)+' · '+m.join('|')};
function md(t){return esc(t).replace(/```[\w+-]*\n?([\s\S]*?)```/g,(m,c)=>`<div class="code"><button onclick="cp(this)">Copy</button><pre>${c.replace(/\n$/,'')}</pre></div>`).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')}
function cp(b){navigator.clipboard.writeText(b.parentNode.querySelector('pre').textContent);b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1200)}

/* ---- API layer ---- */
async function jf(p,url,o){let r;
  const px=p.proxy?(location.protocol=='file:'?'http://localhost:8787':'')+'/proxy?u='+encodeURIComponent(url):url;
  try{r=await fetch(px,o)}catch(e){throw new Error(p.proxy?'Could not reach the local proxy. Start ai-hub-server.py first.':'The browser blocked the request (usually CORS) or the server is unreachable. Turn on "Use local proxy" for this provider.')}
  const t=await r.text();let j;try{j=JSON.parse(t)}catch(e){throw new Error('HTTP '+r.status+' from '+new URL(url).pathname+': '+t.replace(/<[^>]+>/g,' ').trim().slice(0,100))}
  if(!r.ok)throw new Error(j.error?.message||j.message||(typeof j.error=='string'?j.error:'HTTP '+r.status));return j}
async function call(ref,msgs,system){
  const[pid,...mm]=ref.split('|'),model=mm.join('|'),p=S.providers.find(x=>x.id==pid);
  if(!p||!p.key)throw new Error('Add an API key for '+(p?p.name:'this provider')+' in Settings.');
  const base=p.base.replace(/\/$/,'');let r,j;
  if(p.type=='anthropic'){
    const m=msgs.map(x=>({role:x.role,content:[...(x.imgs||[]).map(d=>({type:'image',source:{type:'base64',media_type:d.slice(5,d.indexOf(';')),data:d.split(',')[1]}})),{type:'text',text:x.text||' '}]}));
    j=await jf(p,base+'/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':p.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model,max_tokens:4096,system:system||undefined,messages:m})});
    return j.content.map(c=>c.text||'').join('');
  }
  const m=msgs.map(x=>({role:x.role,content:x.imgs&&x.imgs.length?[{type:'text',text:x.text||' '},...x.imgs.map(d=>({type:'image_url',image_url:{url:d}}))]:x.text}));
  if(system)m.unshift({role:'system',content:system});
  j=await jf(p,base+'/chat/completions',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+p.key},body:JSON.stringify({model,messages:m})});
  return j.choices[0].message.content;
}

/* ---- UI ---- */
function fillModels(){const rs=refs().filter(r=>S.chatOn[r]);$('#msel').innerHTML=tab=='agent'?'<option>Auto-routed by reference AI</option>':rs.length?rs.map(r=>`<option value="${esc(r)}">${esc(label(r))}</option>`).join(''):'<option value="">Activate models in Settings</option>';
  if(tab=='chat'){if(rs.includes(S.cm))$('#msel').value=S.cm;else S.cm=$('#msel').value}}
$('#msel').onchange=e=>{if(tab=='chat'){S.cm=e.target.value;save()}};
function setTab(t){tab=t;$('#t-chat').className=t=='chat'?'on':'';$('#t-agent').className=t=='agent'?'on':'';$('#inp').placeholder=t=='chat'?'Message':'Describe what to build or fix';fillModels();render()}
$('#t-chat').onclick=()=>setTab('chat');$('#t-agent').onclick=()=>setTab('agent');
function render(){const m=$('#main');
  if(tab=='agent'){if(!m.dataset.agent){m.innerHTML=`<div class="empty">What shall we build?<small>A reference AI plans the task and picks the best model for each step.</small></div>`}m.dataset.agent=1;return}
  delete m.dataset.agent;
  m.innerHTML=S.chat.length?S.chat.map(x=>x.role=='user'?`<div class="u">${esc(x.text)}${x.names?`<div class="chips">${x.names.map(n=>`<span class="chip">${esc(n)}</span>`).join('')}</div>`:''}</div>`:`<div class="a">${md(x.text)}</div>`).join(''):`<div class="empty">How can I help?<small>Chat with any model you have a key for.</small></div>`;
  m.scrollTop=m.scrollHeight}
$('#newb').onclick=()=>{if(tab=='chat'){S.chat=[];save();render()}else{const m=$('#main');delete m.dataset.agent;render()}};
$('#inp').oninput=e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'};
$('#attb').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{for(const f of e.target.files){
  if(f.type.startsWith('image/'))atts.push({name:f.name,img:await new Promise(r=>{const x=new FileReader;x.onload=()=>r(x.result);x.readAsDataURL(f)})});
  else atts.push({name:f.name,text:await f.text()})}
  e.target.value='';drawAtt()};
function drawAtt(){$('#att').innerHTML=atts.map((a,i)=>`<span class="chip">${a.img?`<img src="${a.img}">`:'📄 '}${esc(a.name)} <a href="#" onclick="atts.splice(${i},1);drawAtt();return false" style="color:inherit">✕</a></span>`).join('')}
function takeInput(){const t=$('#inp').value.trim();if(!t&&!atts.length)return null;
  const files=atts.filter(a=>a.text).map(a=>`\n\n[File: ${a.name}]\n\`\`\`\n${a.text.slice(0,60000)}\n\`\`\``).join('');
  const o={role:'user',text:t+files,imgs:atts.filter(a=>a.img).map(a=>a.img),names:atts.map(a=>a.name)};
  $('#inp').value='';$('#inp').style.height='auto';atts=[];drawAtt();return o}
$('#send').onclick=async()=>{if(busy)return;const u=takeInput();if(!u)return;busy=true;$('#send').disabled=true;
  try{tab=='chat'?await doChat(u):await doAgent(u)}catch(e){err(e)}busy=false;$('#send').disabled=false};
function err(e){const d=document.createElement('div');d.className='a';d.style.color='var(--acc)';d.textContent='Error: '+e.message;$('#main').append(d)}

async function doChat(u){
  if(!S.cm)throw new Error('Activate a model under Settings > Chat first.');
  S.chat.push(u);render();const th=document.createElement('div');th.className='a';th.textContent='Thinking…';$('#main').append(th);
  try{const out=await call(S.cm,S.chat.map(x=>({role:x.role,text:x.text,imgs:x.imgs})),S.csys||'');S.chat.push({role:'assistant',text:out});save();render()}
  catch(e){th.remove();err(e)}}

/* ---- Agent ---- */
const pj=t=>{const m=t.match(/\{[\s\S]*\}/);return m?JSON.parse(m[0]):null};
const poolList=()=>Object.keys(S.pool).filter(r=>refs().includes(r));
const poolDesc=()=>poolList().map(r=>`- ${r} — ${label(r)}${S.pool[r]?': '+S.pool[r]:''}`).join('\n');
async function doAgent(u){
  const pl=poolList();if(!S.router||!pl.length)throw new Error('Under Settings > Code agent, choose a reference AI and activate at least one model.');
  const m=$('#main');m.dataset.agent=1;if(m.querySelector('.empty'))m.innerHTML='';
  m.insertAdjacentHTML('beforeend',`<div class="u">${esc(u.text)}</div>`);
  const hd=document.createElement('div');hd.className='st';hd.textContent='Reference AI is planning…';m.append(hd);m.scrollTop=m.scrollHeight;
  const sys=`You are the routing agent of a coding assistant. Break the task into 1-5 sequential steps and assign each step the most suitable and cost-efficient model from this pool (use the exact id before the dash):\n${poolDesc()}\nReply with ONLY JSON: {"steps":[{"title":"","instruction":"","model":"<id>","why":"<short reason>"}]}`;
  let plan;try{plan=pj(await call(S.router,[{role:'user',text:u.text,imgs:u.imgs}],sys))}catch(e){throw e}
  if(!plan||!plan.steps||!plan.steps.length)plan={steps:[{title:'Do the task',instruction:u.text,model:pl[0],why:'Planner reply was not valid JSON; using the first pool model.'}]};
  hd.textContent=`Plan: ${plan.steps.length} step${plan.steps.length>1?'s':''}. You can change a step's model before it runs.`;
  const cards=plan.steps.map((s,i)=>{const d=document.createElement('div');d.className='step';
    const opts=pl.map(r=>`<option value="${r}" ${r==s.model?'selected':''}>${esc(label(r))}</option>`).join('');
    d.innerHTML=`<h3>${i+1}. ${esc(s.title)}</h3><p>${esc(s.why||'')}</p><select>${opts}</select><div class="st">Waiting</div><div class="out"></div>`;m.append(d);return d});
  m.scrollTop=m.scrollHeight;
  let done=[];
  for(let i=0;i<plan.steps.length;i++){const s=plan.steps[i],c=cards[i],sel=c.querySelector('select'),st=c.querySelector('.st');
    if(i>0&&S.adapt){st.textContent='Reference AI re-checking model choice…';
      try{const r=pj(await call(S.router,[{role:'user',text:`Task: ${u.text}\nCompleted so far: ${done.map(d=>d.title).join('; ')}\nNext step: ${s.instruction}\nCurrent model: ${sel.value}\nPick the best model for this next step from:\n${poolDesc()}\nReply ONLY JSON: {"model":"<id>","why":""}`}],''));
        if(r&&pl.includes(r.model)&&sel.dataset.touched!=1){sel.value=r.model;c.querySelector('p').textContent=r.why||''}}catch(e){}}
    sel.disabled=true;st.textContent='Running on '+label(sel.value)+'…';c.scrollIntoView({block:'nearest'});
    const ctx=done.map(d=>`## ${d.title}\n${d.out}`).join('\n\n');
    try{const out=await call(sel.value,[{role:'user',text:`Overall task:\n${u.text}\n\n${ctx?'Work done so far:\n'+ctx+'\n\n':''}Current step (${i+1}/${plan.steps.length}): ${s.title}\n${s.instruction}`,imgs:i==0?u.imgs:[]}],'You are a senior software engineer working as one step of a multi-step agent. Do only the current step. Put code in fenced blocks and give each file a name on a comment line at the top. Be concise.'+(S.asys?'\n'+S.asys:''));
      done.push({title:s.title,out});c.querySelector('.out').innerHTML=md(out);st.textContent='Done · '+label(sel.value)}
    catch(e){st.textContent='Failed: '+e.message;sel.disabled=false;break}
    m.scrollTop=m.scrollHeight}
  cards.forEach(c=>c.querySelector('select').addEventListener('change',e=>e.target.dataset.touched=1));
}

/* ---- Settings ---- */
const isOpen=()=>$('#sheet').classList.contains('open');
function openSettings(t){S.stab=refs().length?t:'keys';sheet()}
async function fetchModels(i){const p=S.providers[i];if(!p||!p.key)return;p.err='';p.loading=1;if(isOpen())sheet();
  try{const b=p.base.replace(/\/$/,''),an=p.type=='anthropic';
    const j=await jf(p,an?b+'/v1/models?limit=1000':b+'/models',{headers:an?{'x-api-key':p.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}:{authorization:'Bearer '+p.key}});
    const got=(j.data||j.models||[]).map(m=>(m.id||m.name||'').replace(/^models\//,'')).filter(Boolean);
    p.avail=[...new Set([...got,...(p.manual||[])])].sort()}catch(e){p.err=e.message}
  p.loading=0;save();if(isOpen())sheet()}
function tg(k,el){const r=el.dataset.r;if(el.checked)S[k][r]=S[k][r]||(k=='chatOn'?true:'');else delete S[k][r]}
function addProv(k){if(!k)return;const[t,b]=PRESETS[k];S.providers.push({id:'p'+Date.now(),name:k,type:t,base:b,key:'',avail:[]});sheet()}
const filt=`<input placeholder="Filter models" oninput="document.querySelectorAll('.mrow').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(this.value.toLowerCase()))">`;
function rows(k){const rs=refs();return S.providers.map(p=>{const mine=rs.filter(r=>r.startsWith(p.id+'|'));
  return mine.length?`<h4>${esc(p.name)}</h4>`+mine.map(r=>`<label class="pool mrow"><input type="checkbox" data-r="${esc(r)}" ${r in S[k]?'checked':''} onchange="tg('${k}',this)"><span style="${k=='pool'?'':'flex:1'}">${esc(r.split('|').slice(1).join('|'))}</span>${k=='pool'?`<input data-r="${esc(r)}" placeholder="Good at… (fast, cheap, UI)" value="${esc(S.pool[r]||'')}" oninput="if(this.dataset.r in S.pool)S.pool[this.dataset.r]=this.value">`:''}</label>`).join(''):''}).join('')||'<p class="hint">No models yet. Add an API key under API keys and the provider\'s models will appear here.</p>'}
function sheet(){const pane=$('#pane'),sc=pane.scrollTop,t=S.stab||'keys',rs=refs();
  const tabs=[['keys','API keys'],['chat','Chat'],['agent','Code agent']].map(([k,n])=>`<button class="${t==k?'on':''}" onclick="S.stab='${k}';sheet()">${n}</button>`).join('');
  let body='';
  if(t=='keys')body=`${S.providers.map((p,i)=>`<div class="prov"><input value="${esc(p.name)}" placeholder="Name" oninput="S.providers[${i}].name=this.value"><select onchange="S.providers[${i}].type=this.value"><option value="openai" ${p.type=='openai'?'selected':''}>OpenAI-compatible</option><option value="anthropic" ${p.type=='anthropic'?'selected':''}>Anthropic</option></select>
  <input value="${esc(p.base)}" placeholder="Base URL" oninput="S.providers[${i}].base=this.value"><input type="password" value="${esc(p.key)}" placeholder="API key" oninput="S.providers[${i}].key=this.value" onchange="fetchModels(${i})">
  <label class="pool"><input type="checkbox" ${p.proxy?'checked':''} onchange="S.providers[${i}].proxy=this.checked"><span style="flex:1">Use local proxy (fixes CORS blocks)</span></label>
  <div class="hint" style="margin:4px 0">${p.loading?'Loading models…':p.err?'Could not load models: '+esc(p.err):p.avail.length?p.avail.length+' models found. Activate them under Chat and Code agent.':'Enter a key and its models load automatically.'}</div>
  <input placeholder="Add a model id manually, then press Enter" onkeydown="if(event.key=='Enter'&&this.value.trim()){const q=S.providers[${i}];q.manual=[...(q.manual||[]),this.value.trim()];q.avail=[...new Set([...q.avail,this.value.trim()])].sort();sheet()}">
  <button class="btn" onclick="fetchModels(${i})">Refresh models</button> <button class="btn" onclick="S.providers.splice(${i},1);sheet()">Remove</button></div>`).join('')}
  <select onchange="addProv(this.value)"><option value="">Add provider…</option>${Object.keys(PRESETS).map(k=>`<option>${k}</option>`).join('')}</select>
  <p class="hint">Keys stay in this browser and are sent only to the provider you set. If a provider blocks browser calls (CORS), run ai-hub-server.py and tick Use local proxy.</p>`;
  else if(t=='chat')body=`<h4>Models available in Chat</h4>${filt}${rows('chatOn')}<h4>System prompt</h4><textarea rows="3" placeholder="Optional instructions applied to every chat" oninput="S.csys=this.value">${esc(S.csys||'')}</textarea>`;
  else body=`<h4>Reference AI (plans and routes)</h4><select onchange="S.router=this.value"><option value="">Choose…</option>${rs.map(r=>`<option value="${esc(r)}" ${r==S.router?'selected':''}>${esc(label(r))}</option>`).join('')}</select>
  <label class="pool"><input type="checkbox" ${S.adapt?'checked':''} onchange="S.adapt=this.checked"><span style="flex:1">Re-pick the model before each step</span></label>
  <h4>Models the agent may use</h4>${filt}${rows('pool')}<h4>Extra instructions for coding steps</h4><textarea rows="3" placeholder="e.g. Use TypeScript, prefer small functions" oninput="S.asys=this.value">${esc(S.asys||'')}</textarea>`;
  pane.innerHTML=`<h2>Settings</h2><div class="tabs" style="margin:0 0 8px">${tabs}</div>${body}<p><button class="btn p" onclick="closeSheet()">Done</button></p>`;
  $('#sheet').classList.add('open');pane.scrollTop=sc}
function closeSheet(){$('#sheet').classList.remove('open');save();fillModels()}
$('#setb').onclick=()=>openSettings(tab);$('#sheet').onclick=e=>{if(e.target.id=='sheet')closeSheet()};
fillModels();render();if(!S.providers.length){S.stab='keys';sheet()}
</script></body></html>
